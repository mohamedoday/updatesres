      (function forceDismissPreloaderEarly() {
        function hideLoaderNow() {
          try {
            var loader = document.getElementById("royalPreloader");
            if (loader) {
              loader.classList.add("is-done");
              loader.style.opacity = "0";
              loader.style.visibility = "hidden";
              loader.style.pointerEvents = "none";
              setTimeout(function () {
                if (loader && loader.parentNode) {
                  loader.style.display = "none";
                }
              }, 250);
            }
          } catch (_) {}
        }

        if (document.readyState !== "loading") {
          setTimeout(hideLoaderNow, 250);
        } else {
          document.addEventListener("DOMContentLoaded", function () {
            setTimeout(hideLoaderNow, 250);
          });
        }
        window.addEventListener("load", function () {
          setTimeout(hideLoaderNow, 150);
        });
        setTimeout(hideLoaderNow, 650);
        window.__hideRoyalPreloader = hideLoaderNow;
      })();
    </script>

        function formatIQD(amount) {
          var safe = Number.isFinite(Number(amount)) ? Number(amount) : 0;
          return safe.toLocaleString("en-US") + " د.ع";
        }

        function loadBag() {
          try {
            var raw = localStorage.getItem(BAG_STORAGE_KEY);
            if (!raw) return [];
            var parsed = JSON.parse(raw);
            if (!Array.isArray(parsed)) return [];
            return parsed.filter(function (item) {
              return item && typeof item.id === "string" && typeof item.qty === "number" && item.qty > 0;
            });
          } catch (_) {
            return [];
          }
        }
